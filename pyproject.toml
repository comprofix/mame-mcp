[project]
name = "mame-mcp"
version = "0.1.0"
description = "Proof of concept: local MAME bridge plus MCP server for bounded debugger experiments"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mame-mcp-server = "mame_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real MAME build (set MAME_EXE, MAME_ROMPATH)"]
